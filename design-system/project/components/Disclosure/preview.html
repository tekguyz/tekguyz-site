<!-- @dsCard group="Disclosure" height=300 subtitle="A box that changes size, and hides itself properly" -->
<div class="wrap">
  <div class="row" data-open="true">
    <button class="trigger" type="button" aria-expanded="true">
      <span class="q">How long does a first build usually take?</span>
      <span class="mark" aria-hidden="true"></span>
    </button>
    <div class="collapse"><div><p class="a">Long enough to get it right, and we tell you the shape of it before we start. The scope drives the schedule, not the other way round.</p></div></div>
  </div>
  <div class="row" data-open="false">
    <button class="trigger" type="button" aria-expanded="false">
      <span class="q">Do you hand over the code?</span>
      <span class="mark" aria-hidden="true"></span>
    </button>
    <div class="collapse"><div><p class="a">Yes. It is your system, in your repository, from the first commit.</p></div></div>
  </div>
</div>

<script>
  for (const t of document.querySelectorAll('.trigger')) {
    t.addEventListener('click', () => {
      const row = t.closest('.row');
      const open = row.dataset.open !== 'true';
      row.dataset.open = String(open);
      t.setAttribute('aria-expanded', String(open));
    });
  }
</script>
