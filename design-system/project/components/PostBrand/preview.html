<div id="root"></div>
<script>
(function () {
  var T = window.TEKGUYZ, h = React.createElement, el;
  function cell(node, caption) { return h('div', {className: 'cell'}, node, h('p', {className: 'cap'}, caption)); }
  function cap(t) { return h('p', {className: 'cap'}, t); }
  function post(dark) {
  return h('div', {className: dark ? 'ink-band' : '', style: {width: 340, height: 425, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', textAlign: 'center', border: '1px solid var(--tg-border)', borderRadius: 12, background: dark ? '#101010' : '#ffffff', color: dark ? '#f5f5f5' : '#111111', padding: 24}},

    h('p', {style: {margin: '12px 0 0', fontSize: 14, color: dark ? '#7B8291' : '#6a717e'}}, 'tekguyz.com')

}
el = h('div', {className: 'pv col'},
  h('div', {className: 'row', style: {gap: 24, alignItems: 'flex-start'}}, post(false), post(true)),

})();
</script>
