<div id="root"></div>
<script>
(function () {
  var T = window.TEKGUYZ, h = React.createElement, el;
  function cell(node, caption) { return h('div', {className: 'cell'}, node, h('p', {className: 'cap'}, caption)); }
  function cap(t) { return h('p', {className: 'cap'}, t); }
  el = h('div', {className: 'pv'},
  h(T.Testimonial, {author: 'Joe M.', source: 'Verified Google review'},
    'TEKGUYZ integrated our 3CX phones with Twilio and Zoho CRM to fully automate our text surveys and protect our customer experience. They also built a custom internal tool that tracks our team’s offline project work perfectly without micro-management. Exceptional execution.')
);
  ReactDOM.createRoot(document.getElementById('root')).render(el);
})();
</script>

  .pv { padding: 24px; }

  .row.pv, .col.pv { padding: 24px; }
  .cell { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
