<!-- @dsCard height=300 -->
<!--
  Derivation
  Blocks: tg-fg slab 176x252 (space-32 + space-12 wide) anchoring the right box, with four
    satellites at full accent value - blue 128x128, violet 144x128 bleeding off the right edge,
    amber 64x108, teal 208x108 also bleeding. Corners rx = radius-container (16) on the large
    blocks, radius-card (12) on the low pair. All sides are spacing-scale steps or sums of them.
  Arrangement: one tall slab with satellites, two of which bleed off the right edge - the way the
    hero media panel composes, and the reason the picture is weighted left-to-right into the name.
  Pattern row: a literal motif. The brand mark IS four accent nodes joined by hairline connectors,
    so the pattern is that mark repeated on a 64px pitch - six units, 24 nodes, 24 connectors.
    A generic technical system would land on the dot grid; only this one has the diamond.
  Steps and radii: pitch 64 (space-16), node offset 22, node r 5, block sides 48/64/108/128/144/176/252
    off the 4px base scale, rx 16 (radius-container) and 12 (radius-card), left inset 48 (space-12).
-->

  <rect class="ground" x="0" y="0" width="960" height="300" />

  <rect class="slab" x="496" y="24" width="176" height="252" rx="16" />
  <rect class="blue" x="688" y="24" width="128" height="128" rx="16" />
  <rect class="violet" x="832" y="24" width="144" height="128" rx="16" />

  <g class="wire">

    <g transform="translate(616 86)"><path d="M0 -22 L-22 0 L0 22 L22 0 Z" /></g>
    <g transform="translate(552 150)"><path d="M0 -22 L-22 0 L0 22 L22 0 Z" /></g>

  </g>

  <text class="name" x="48" y="228">TEKGUYZ</text>
