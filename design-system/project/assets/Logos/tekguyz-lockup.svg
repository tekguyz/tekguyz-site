       production master, open in Figma/Illustrator and convert the wordmark to outlined
       paths, so the file no longer depends on the viewer having the font installed. -->
  <g transform="translate(10, 26)">
    <line x1="34" y1="12" x2="14" y2="32" stroke="#E5E7EB" stroke-width="2.2"/>
    <line x1="34" y1="12" x2="54" y2="32" stroke="#E5E7EB" stroke-width="2.2"/>
    <line x1="14" y1="32" x2="34" y2="52" stroke="#E5E7EB" stroke-width="2.2"/>
    <line x1="54" y1="32" x2="34" y2="52" stroke="#E5E7EB" stroke-width="2.2"/>
    <circle cx="34" cy="12" r="7.5" fill="#3B6FE0"/>
    <circle cx="54" cy="32" r="7.5" fill="#7C6FE0"/>
    <circle cx="34" cy="52" r="7.5" fill="#F2A93C"/>
    <circle cx="14" cy="32" r="7.5" fill="#2FA679"/>
  </g>
  <text x="96" y="72" font-family="Geist, Inter, sans-serif" font-weight="800" font-size="40" letter-spacing="-0.8" fill="#111111">TEKGUYZ</text>
</svg>
