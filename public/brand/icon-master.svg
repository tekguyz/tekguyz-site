<svg width="512" height="512" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- TEKGUYZ master icon — Connected Nodes, floating, no container -->
  <!-- Connector lines: hairline token (#E5E7EB light / #2A2A2C dark) -->
  <line x1="32" y1="12" x2="12" y2="32" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="32" y1="12" x2="52" y2="32" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="12" y1="32" x2="32" y2="52" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="52" y1="32" x2="32" y2="52" stroke="#E5E7EB" stroke-width="2"/>
  <!-- Nodes: full accent colors, fixed order top/right/bottom/left = blue/violet/amber/teal -->
  <circle cx="32" cy="12" r="7" fill="#3B6FE0"/>
  <circle cx="52" cy="32" r="7" fill="#7C6FE0"/>
  <circle cx="32" cy="52" r="7" fill="#F2A93C"/>
  <circle cx="12" cy="32" r="7" fill="#2FA679"/>
</svg>
