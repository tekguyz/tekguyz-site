name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Never the aggregate `bun run test`: it is set to fail. See CLAUDE.md.
      - run: bun run test:unit
      # `prebuild` runs test:unit again (~1s). Kept: a local build must gate on it too.
      # No secrets on purpose: the build must pass with none present.
      - run: bun run build
